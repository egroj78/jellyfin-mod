name: Compilar Jellyfin (mod) para Fire TV

on:
  workflow_dispatch:
    inputs:
      jellyfin_version:
        description: "Versión de Jellyfin Android TV a modificar"
        default: "v0.19.10"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar este repositorio (parche + firma)
        uses: actions/checkout@v4

      - name: Descargar Jellyfin Android TV ${{ inputs.jellyfin_version }}
        run: git clone --depth 1 --branch "${{ inputs.jellyfin_version }}" https://github.com/jellyfin/jellyfin-androidtv.git upstream

      - name: Aplicar modificaciones (desfase de subtítulos + info del medio)
        working-directory: upstream
        run: git apply --verbose ../jellyfin-firetv.patch

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: |
          mkdir out
          find upstream/app/build/outputs/apk -name "*.apk" -exec cp {} out/jellyfin-mod.apk \;
          ls -la out

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jellyfin (mod) ${{ inputs.jellyfin_version }} · build ${{ github.run_number }}
          body: |
            Jellyfin Android TV ${{ inputs.jellyfin_version }} con desfase de subtítulos y botón de información del medio.
            Descarga directa (para Downloader en el Fire TV): https://github.com/${{ github.repository }}/releases/latest/download/jellyfin-mod.apk
          files: out/jellyfin-mod.apk
          make_latest: true
